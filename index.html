<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2"><meta name="description" content="日本・韓国・海外の編み物アイデアを、動画とともに年・月別に記録する図鑑。">
<title>Amimono Trend | 編み物トレンド図鑑</title>
<style>
:root{--bg:#f7f6f2;--surface:#fff;--ink:#26342d;--muted:#69766f;--line:#e1e5de;--accent:#396e54;--soft:#e7eee8;--highlight:#f2e7d2}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}header{border-bottom:1px solid var(--line);background:rgba(247,246,242,.96)}.wrap{max-width:1160px;margin:auto;padding:0 26px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:77px}.logo{font-family:Georgia,serif;font-size:23px;font-weight:bold;letter-spacing:-.7px}.logo span{color:var(--accent)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:bold;text-transform:uppercase}.hero{padding:35px 0 24px;display:flex;align-items:end;justify-content:space-between;gap:24px}h1{margin:12px 0;font-family:Georgia,"Noto Serif JP",serif;font-size:clamp(30px,4vw,46px);line-height:1.22;letter-spacing:-1.4px}h1 em{font-style:normal;color:var(--accent)}.lead{color:var(--muted);max-width:650px;margin:0}.info{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow:auto;white-space:nowrap}.tab{background:none;border:0;padding:17px 2px;font-size:14px;font-weight:bold;color:var(--muted);border-bottom:3px solid transparent}.tab.active{color:var(--accent);border-color:var(--accent)}main{padding-bottom:80px}.pane{display:none;padding-top:28px}.pane.active{display:block}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:4px 0 19px}.section-head h2{margin:0;font-size:22px}.sub{color:var(--muted);font-size:13px;margin:5px 0 0}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:var(--soft);font-size:11px;font-weight:bold;color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 32px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px}.stat strong{font-size:27px;font-family:Georgia,serif;display:block;line-height:1.3}.stat small{font-size:12px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:27px}.panel h3{margin:0 0 8px;font-size:17px}.panel p{color:var(--muted);font-size:13px;margin:5px 0}.shape{font-size:12px;color:var(--ink);margin:8px 0;line-height:1.55}.trendnote{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.7}.yearbar{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 24px}.yearbtn{background:#f0f3ed;border:1px solid #d8e3da;border-radius:9px;padding:10px 20px;color:var(--accent);min-width:105px}.yearbtn span{display:block;font-size:13px}.yearbtn strong{font-size:15px}.yearbtn.active{background:var(--accent);color:white}.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px;margin:0 0 24px}.month{background:#f0f3ed;border-radius:9px;padding:12px 3px;text-align:center;min-height:69px;border:1px solid transparent;color:#7c887e}.month.has{background:var(--soft);color:var(--accent);border-color:#c8dccb;cursor:pointer}.month.active{background:var(--accent);color:#fff}.month span{font-size:11px;display:block}.month strong{font-size:16px;display:block}.monthDetail{background:#f7f8f5;border-radius:12px;padding:17px;margin-top:14px}.monthDetail h4{margin:0 0 8px}.monthDetail ul{padding-left:19px;margin:8px 0;font-size:13px;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0 22px}.controls input,.controls select{border:1px solid #d7ddd5;background:#fff;border-radius:10px;padding:12px 13px;min-height:43px;color:var(--ink)}.controls input{flex:1;min-width:180px}.controls select{min-width:135px}.count{font-size:12px;color:var(--muted);margin:0 0 14px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #26342d14}.cardimage{display:block;width:100%;aspect-ratio:16/10;position:relative;background:#edf0eb;overflow:hidden}.cardimage img{width:100%;height:100%;object-fit:cover;display:block}.cardimage .play{position:absolute;bottom:10px;right:10px;background:#171e1ac7;color:white;border-radius:7px;padding:3px 8px;font-size:11px}.cardimage .fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}.cardimage.missing img{display:none}.cardimage.missing .fallback{display:flex}.body{padding:13px}.body h3{font-size:14px;line-height:1.5;margin:5px 0 3px}.en{font-size:11px;color:var(--muted);margin:0 0 10px;min-height:16px}.meta{font-size:11px;color:var(--muted);margin:0}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.tag{display:inline-block;border:1px solid var(--line);font-size:10px;border-radius:5px;padding:2px 6px;color:#56665a}.open{display:inline-flex;margin-top:10px;color:var(--accent);text-decoration:none;font-size:12px;font-weight:bold;gap:4px}.open:hover{text-decoration:underline}.yearlist{display:grid;gap:13px}.year{border:1px solid var(--line);border-radius:13px;background:white;overflow:hidden}.year summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;padding:17px 20px;font-weight:bold}.year summary::-webkit-details-marker{display:none}.year summary small{font-size:12px;color:var(--muted);font-weight:normal}.yearInner{padding:0 19px 17px}.yearInner p{margin:0 0 14px;font-size:12px;color:var(--muted)}.timeline-list{display:grid;gap:10px}.event{display:grid;grid-template-columns:80px 1fr;gap:12px;border-left:3px solid #c6d9c9;background:#f8f9f6;padding:11px;border-radius:0 8px 8px 0}.event time{font-size:13px;font-weight:bold;color:var(--accent)}.event p{margin:2px 0;font-size:13px;color:var(--ink)}.note{font-size:12px;color:var(--muted)}.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.top{min-height:69px}.top .info{text-align:right}.tabs{margin-top:0}footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12px}.linkbtn{text-decoration:none;background:var(--ink);color:white;border-radius:9px;padding:9px 14px;font-size:12px}.method{font-size:12px;color:var(--muted);margin-top:20px}@media(max-width:950px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:660px){.wrap{padding:0 16px}.hero{display:block;padding-top:34px}.info{text-align:left;margin-top:15px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body{padding:10px}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:23px}.months{grid-template-columns:repeat(6,1fr)}.controls{gap:7px}.controls select{min-width:calc(50% - 4px);flex:1}.panel{padding:15px}.event{grid-template-columns:60px 1fr}.tab{font-size:13px}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div class="logo">Amimono<span>Trend.</span></div><div class="info">更新 <strong id="updated">—</strong></div></div>
<nav class="tabs" aria-label="表示切り替え"><button class="tab active" data-tab="current">月別トレンド</button><button class="tab" data-tab="history">年別トレンド</button><button class="tab" data-tab="library">作品図鑑</button></nav>
<main>
<section class="pane active" id="current"><div class="months" id="months"></div><p class="trendnote" id="monthNote"></p><div class="cards" id="currentCards"></div></section>
<section class="pane" id="history"><div class="yearbar" id="yearbar"></div><p class="trendnote" id="yearNote"></p><div class="cards" id="historyCards"></div></section>
<section class="pane" id="library"><div class="controls"><input id="search" type="search" aria-label="作品検索" placeholder="作品名・形・英語名で検索"><select id="scope" aria-label="作品の分類"><option value="">すべての作品</option><option value="discovery">名前や形が特徴的</option><option value="trending">流行した作品</option><option value="classic">定番作品</option></select><select id="cat" aria-label="カテゴリー"><option value="">すべての種類</option></select></div><div class="count" id="resultCount"></div><div class="cards" id="allCards"></div></section>
</main></div>
<footer><div class="wrap">Amimono Trend · 画像・作品の権利は各作者に帰属します。</div></footer>
<script src="./data.js?v=20261105-curation3"></script>
<script>
(function(){
"use strict";
var data=window.AMIMONO_DATA||{updated:"—",items:[],observations:[]};
var items=data.items||[],obs=data.observations||[],nowYear=new Date().getFullYear();
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
function dateYear(item){return item.published?Number(item.published.substring(0,4)):item.firstYear}
function formatNumber(v){return typeof v==="number"?new Intl.NumberFormat("ja-JP").format(v):"未記録"}
function card(x){
 var thumb="https://i.ytimg.com/vi/"+encodeURIComponent(x.videoId)+"/hqdefault.jpg";
 var url="https://www.youtube.com/watch?v="+encodeURIComponent(x.videoId);
 return '<article class="card"><a href="'+url+'" class="cardimage" target="_blank" rel="noopener noreferrer" aria-label="'+esc(x.name)+'の制作動画"><img loading="lazy" alt="'+esc(x.name)+'の制作動画サムネイル" src="'+thumb+'" onerror="this.parentElement.classList.add('+"'missing'"+')"><span class="fallback">サムネイルを表示できません</span><span class="play">YouTubeで見る ↗</span></a><div class="body"><div class="badges"><span class="tag">'+(x.evidence==="video"?"動画記録":"要再確認")+'</span><span class="tag">投稿地域: '+esc(x.region)+'</span><span class="tag">'+esc(x.category)+'</span></div><h3>'+esc(x.name)+'</h3><p class="en">'+esc(x.english)+'</p>'+(x.shape?'<p class="shape">'+esc(x.shape)+'</p>':'')+'<p class="meta">'+esc(x.channel)+'</p>'+(x.published?'<p class="meta">'+esc(x.published.slice(0,7))+'</p>':"")+''+(typeof x.views==="number"?'<p class="meta">再生 '+formatNumber(x.views)+'</p>':"")+'<a class="open" href="'+url+'" target="_blank" rel="noopener noreferrer">動画を見る ↗</a></div></article>';
}
function groupKey(x){return x.groupId||x.id}
function rankVideo(x){
 // 再生数が確認済みならそれを優先。未確認の代表は固定指定を参考にする。
 return [typeof x.views==="number"?1:0,typeof x.views==="number"?x.views:0,typeof x.likes==="number"?x.likes:0,x.featured?1:0,x.evidence==="video"?1:0];
}
function betterVideo(a,b){
 var x=rankVideo(a),y=rankVideo(b);
 for(var i=0;i<x.length;i++){if(x[i]!==y[i])return x[i]>y[i]}
 return false;
}
function periodCutoff(period){
 var end=String(period).length===4?period+"-12-31":period+"-31";
 return data.updated&&data.updated<end?data.updated:end;
}
function availableByDate(item,cutoff){
 // 過去時点の記録では、公開日が不明な動画を採用しない。
 return typeof item.published==="string" && /^\d{4}-\d{2}-\d{2}$/.test(item.published) && item.published<=cutoff;
}
function periodItems(ids,cutoff){
 // 作品のIDから同一groupIdの全動画を探し、その時点までの公開作だけを使う。
 var selected=new Set(ids.map(function(id){
  var item=items.find(function(x){return x.id===id});
  return item?groupKey(item):null;
 }).filter(Boolean));
 return Array.from(selected).map(function(key){
  var candidates=items.filter(function(x){return groupKey(x)===key&&availableByDate(x,cutoff)});
  if(!candidates.length)return null;
  var best=candidates[0];
  candidates.forEach(function(x){if(betterVideo(x,best))best=x});
  var canonical=items.find(function(x){return groupKey(x)===key&&x.canonicalName})||items.find(function(x){return groupKey(x)===key});
  return Object.assign({},best,{name:canonical.canonicalName||canonical.name,groupId:key,sourceCount:candidates.length});
 }).filter(Boolean);
}
function uniqueItems(arr){
 var selected=new Map();
 arr.forEach(function(item){selected.set(groupKey(item),true)});
 return Array.from(selected.keys()).map(function(key){
  var candidates=arr.filter(function(item){return groupKey(item)===key});
  var best=candidates[0];
  candidates.forEach(function(item){if(betterVideo(item,best))best=item});
  var canonical=items.find(function(item){return groupKey(item)===key&&item.canonicalName})||candidates[0];
  return Object.assign({},best,{name:canonical.canonicalName||canonical.name,groupId:key,sourceCount:candidates.length});
 });
}
function cards(arr,el){arr=uniqueItems(arr);$(el).innerHTML=arr.length?arr.map(card).join(""):'<div class="empty">まだ記録がありません。</div>'}
function initTabs(){document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){document.querySelectorAll(".tab").forEach(function(n){n.classList.toggle("active",n===t)});document.querySelectorAll(".pane").forEach(function(n){n.classList.toggle("active",n.id===t.dataset.tab)})})})}
function initCurrent(){
 $("updated").textContent=data.updated;
 var yearObs=obs.filter(function(x){return Number(x.month.slice(0,4))===nowYear}).sort(function(a,b){return a.month.localeCompare(b.month)});
 var selected=yearObs.length?yearObs[yearObs.length-1].month:null;
 function renderMonth(){
  $("months").innerHTML=Array.from({length:12},function(_,i){
   var m=nowYear+"-"+String(i+1).padStart(2,"0"),record=yearObs.find(function(x){return x.month===m});
   var n=record?periodItems(record.itemIds,periodCutoff(m)).length:0;
   return '<button class="month '+(record?"has ":"")+(m===selected?"active":"")+'" data-month="'+m+'" '+(record?"":"disabled")+'><span>'+String(i+1)+'月</span><strong>'+(record?n:"—")+'</strong></button>';
  }).join("");
  document.querySelectorAll(".month.has").forEach(function(b){b.addEventListener("click",function(){selected=b.dataset.month;renderMonth()})});
  var record=yearObs.find(function(x){return x.month===selected});
  var arr=record?periodItems(record.itemIds,periodCutoff(selected)):[];
  $("monthNote").textContent=record?"各月末（今月は最終更新日）までに公開された動画のみ掲載。主に制作動画の公開月に基づく参考記録で、月間の流行順位・ピークではありません。":"";
  $("currentCards").innerHTML=arr.length?arr.map(card).join(""):'<div class="empty">この時点までの制作動画を確認できた作品はありません。</div>';
 }
 renderMonth();
}
function initHistory(){
 var trends=data.trendYears||{};
 var list=Array.from({length:nowYear-2015+1},function(_,i){return nowYear-i});
 var selected=nowYear;
 function getYearItems(y){
  return periodItems(trends[String(y)]||[],periodCutoff(String(y)));
 }
 function renderYear(){
  $("yearbar").innerHTML=list.map(function(y){
   var n=getYearItems(y).length;
   return '<button class="yearbtn '+(selected===y?"active":"")+'" data-year="'+y+'" aria-pressed="'+(selected===y)+'"><span>'+y+'年</span><strong>'+(n||"—")+'</strong></button>';
  }).join("");
  document.querySelectorAll(".yearbtn").forEach(function(b){b.addEventListener("click",function(){selected=Number(b.dataset.year);renderYear()})});
  var arr=getYearItems(selected);
  $("yearNote").textContent=arr.length?"その年末（今年は最終更新日）までに公開された動画のみ掲載。流行資料と制作動画に基づく参考一覧で、作品別の人気順位や急上昇を意味しません。":"";
  $("historyCards").innerHTML=arr.length?arr.map(card).join(""):'<div class="empty">この年までに公開された制作動画を確認できた作品はまだありません。</div>';
 }
 renderYear();
}
function addOptions(id,values){$(id).innerHTML+=[...new Set(values)].filter(Boolean).sort().map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>'}).join("")}
function initLibrary(){
 addOptions("cat",items.map(function(x){return x.category}));
 var trendKeys=new Set([].concat.apply([],Object.values(data.trendYears||{})).map(function(id){var x=items.find(function(n){return n.id===id});return x?groupKey(x):id}));
 function filter(){
  var q=$("search").value.trim().toLocaleLowerCase(),cat=$("cat").value,scope=$("scope").value;
  var arr=items.filter(function(x){
   var matchedScope=!scope||(scope==="classic"?x.classic===true:scope==="discovery"?!!x.shape:trendKeys.has(groupKey(x)));
   return matchedScope&&(!cat||x.category===cat)&&[x.name,x.canonicalName,x.english,x.channel,x.shape,(x.tags||[]).join(" ")].join(" ").toLocaleLowerCase().includes(q);
  });
  $("resultCount").textContent=uniqueItems(arr).length+"種類";cards(arr,"allCards");
 }
 ["search","cat","scope"].forEach(function(id){$(id).addEventListener(id==="search"?"input":"change",filter)});filter();
}
initTabs();initCurrent();initHistory();initLibrary();
})();
</script>
</body></html>
